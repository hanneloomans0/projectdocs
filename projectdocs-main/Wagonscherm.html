<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Train Wagon Layout Scalable</title>
<link rel="stylesheet" href="WagonschermStyle.css" />
</head>
<body>
  <body>
    <a href = "week7.html">
    <button>Back</button>
  </a>
    <div class="screen">

    <!-- TOP ROUTE SECTION -->
    <section class="route">
      <div class="route-line">
        <div class="station inactive">HASSELT</div>
        <div class="station active">DIEPENBEEK</div>
        <div class="station active">BILZEN</div>
        <div class="station active">TONGEREN<br>TONGRES</div>
        <div class="station active">GLAANEN<br>GLONS</div>
        <div class="station active">LIERS</div>
        <div class="station active">MILMORT</div>
        <div class="station active">HERSTAL</div>
      </div>

      <div class="arrows">
        ➤ ➤ ➤ ➤ ➤ ➤ ➤ ➤
      </div>
    </section>

    <!-- WAGON SECTION -->
    <section class="train">
      <div class="wagon rounded">
        <span class="wagon-title">WAGON 1</span>
        <span class="wagon-number">2</span>
      </div>

      <div class="wagon">
        <span class="wagon-title">WAGON 2</span>
        <span class="wagon-number">2</span>
      </div>

      <div class="wagon">
        <span class="wagon-title">WAGON 3</span>
        <span class="wagon-number">1</span>
      </div>

      <div class="wagon">
        <span class="wagon-title">WAGON 4</span>
        <span class="wagon-number">2</span>
      </div>

      <div class="wagon">
        <span class="wagon-title">WAGON 5</span>
        <span class="wagon-number">1</span>
      </div>

      <div class="wagon">
        <span class="wagon-title">WAGON 6</span>
        <span class="wagon-number">2</span>
      </div>

      <div class="wagon rounded">
        <span class="wagon-title">WAGON 7</span>
        <span class="wagon-number">2</span>
      </div>
    </section>

    <!-- ALERT BAR -->
    <section class="alert">
      <div class="alert-icon">!</div>

      <div class="alert-text">
        <div>5 min vertraging IC1584 naar LUIK - LIÈGE</div>
        <div>5 min delay IC1584 to LUIK - LIÈGE</div>
        <div>5 min délai IC1584 vers LUIK - LIÈGE</div>
      </div>

      <div class="time">09:25:59</div>
    </section>

  </div>
</body>
</html>
